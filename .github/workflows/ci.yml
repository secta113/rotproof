name: CI

on:
  push:
  pull_request:

jobs:
  # Each job may run about five times its slowest run, rounded up to ten minutes. A job that hangs otherwise runs for
  # GitHub's default of six hours
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same base image as the Dockerfile. The components come from rust-toolchain.toml, as in the Dockerfile
    container: rust:1.98.1
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # The same entry point as on a developer machine
      - run: cargo xtask ci

  # The wheels pip installs. Windows builds and tests natively, so the binary is tested on the platform it runs on
  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo test --workspace --no-fail-fast
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-build.txt
      - run: maturin build --release --out dist
      # The wheel installs, and its binary runs, as it will for a user
      - run: pip install --find-links dist rotproof
      - run: rotproof --version
      # Run as a user runs it, as release.yml does, so a change of behaviour that breaks it is seen on the push that
      # makes it, not on the day of a tag
      - run: bash .github/smoke.sh
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
