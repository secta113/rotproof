# The Python package: a wheel that carries only the Rotproof binary (no Python code), installed with pip like ruff
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "rotproof"
description = "Keeps a project's structure from drifting: checks its layers and the records an agent works from (specs, work items, knowledge, log)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
# The notices of the crates the binary links go with it, in the wheel's .dist-info/licenses/
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.txt"]
# Taken from Cargo.toml
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/secta113/rotproof"

[tool.maturin]
bindings = "bin"
# The binary is the handler's: the workspace at the root has no package of its own
manifest-path = "crates/handler/Cargo.toml"
