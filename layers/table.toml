# The layer table: what the layers are, the same in every stack. Where a layer lives in a project is in the layout of
# its stack (<stack>.toml next to this file).
#
# `imports` lists the layers a layer may import, besides itself. The generated documentation of each layer says it
# after the role, so the two are written once. A role is written for every stack: a port is "an interface", which a
# stack writes as a Protocol, an interface or a trait.
#
# A layer may have levels (`[[layer.level]]`), each a place of its own inside the layer. A level's `imports` names
# layers, or a level of another layer as `<layer>.<level>`. With `ordered = true` a level may also import the levels
# below it, as listed (the atomic levels of `ui`); otherwise the levels of a layer never import each other. A layer
# with levels holds nothing beside them.
#
# Order matters: `rotproof create` makes the layers in this order, and the documentation lists the imports in it.

# The file the program starts from, which each layout names (`__main__.py`, `src/main.tsx`): no layer, and nothing
# imports it
[entry]
imports = ["composition"]
role = """
The file the program starts from. It calls `composition` to build the program, and starts it."""

[[layer]]
name = "composition"
imports = ["ui", "presentation", "infrastructure", "application", "protocol", "domain"]
role = """
The composition root: the one place that wires the program. It builds the implementations in
`infrastructure.outbound`, passes them to the use cases in `application`, and passes the use cases to the entry
points in `infrastructure.inbound` and to the UI, whose screens hand them to their models in
`presentation.models`.

What the entry points and the connections both need at run time (configuration, a database connection, a logger,
a clock) is built here and passed to each."""

# `ui` names the levels of `presentation` and of `protocol` it reaches, not the layers: the rows of those layers hold
# `domain`, and the table is closed under chaining, so naming a layer would let `ui` import `domain`
[[layer]]
name = "ui"
imports = ["presentation.models", "presentation.display", "protocol.inbound"]
role = """
The view: what the user sees and touches, written with the UI framework (components, widgets). `composition`
registers it.

It shows what `presentation` hands it and passes the user's actions back; what a screen holds and decides is in
`presentation.models`. Does not import `application`, `domain` or `infrastructure`. Organized by atomic design:
`pages` > `templates` > `organisms` > `molecules` > `atoms`; a level may import the levels below it, and only
`pages` know the models. Split by level first, and by feature only inside a level.

Every part of the UI sits in a level, and nothing sits beside them: what the whole UI shares goes in the lowest
level that may know what it knows."""
# The atomic levels, top first
ordered = true

[[layer.level]]
name = "pages"
imports = ["presentation.models", "presentation.display", "protocol.inbound"]
role = """
One screen each. The only part of `ui` that knows `presentation.models`: it takes the use cases `composition`
passes in, as the input ports of `protocol.inbound`, gives them to its model, and shows the model's state through
the levels below.

A provider that hands a model's state to the parts of one screen sits here; one for the whole program, in
`composition`."""

[[layer.level]]
name = "templates"
imports = ["presentation.display"]
role = """
Layout: how organisms are arranged. Knows only the plain values of `presentation.display`; actions come in as
callbacks."""

[[layer.level]]
name = "organisms"
imports = ["presentation.display"]
role = """
Meaningful groups, such as a list or a control panel. They know only the plain values of `presentation.display`,
neither the models nor `domain`; actions come in as callbacks.

A provider that hands display values to its children, such as the signed-in user, sits here too, with the hook
that reads it. It takes the function that loads the values as a callback from the page above."""

[[layer.level]]
name = "molecules"
imports = []
role = """
Combinations of atoms, such as an input with a button. Like atoms, they know no project concept: they import
nothing from `presentation`."""

[[layer.level]]
name = "atoms"
imports = []
role = """
The smallest parts, visible or not: one button, one label, a design value (a colour, a spacing, a font, an
animation), one behaviour (following the width of the screen, detecting a click outside), a provider that hands
a theme to its children. They know no project concept: they import nothing from `presentation`, and take only
plain values.

If a part cannot be named without referring to where it is used, it is not an atom."""

# The Presentation Model (Fowler), held to the inward direction of the onion: `ui` knows it, and it knows no view.
# The row holds `protocol` and `domain` for what reads a layer whole, as the manifest of a Rust crate does, and for
# the closure; its levels import less
[[layer]]
name = "presentation"
imports = ["protocol", "domain"]
role = """
The state and behaviour of the screens, apart from the views that draw them: what a screen holds and decides, so
it can be tested without drawing anything. The screens of the UI use it, and `composition` passes it the use
cases.

Knows no view, and does not import `application`, `domain` or `infrastructure`: it calls the use cases through the
input ports of `protocol.inbound`, as an entry point does. It may use the state of the UI framework (React's
hooks), but draws nothing. A decision another entry point (the command line, another UI) would need too belongs in
`application`; one only this screen has belongs here."""
# The models over the data they hand out
ordered = true

[[layer.level]]
name = "models"
imports = ["protocol.inbound"]
role = """
One model per screen, or per part of a screen that holds state: the values being typed, what is shown as invalid,
whether a request is under way, the error to show, where to go next. Each calls the input ports of
`protocol.inbound` it is given, and turns what they return into the values of `display`."""

[[layer.level]]
name = "display"
imports = []
role = """
The plain data the models hand to the view: the shape of a screen's state and of the actions it takes, and values
formatted for showing. No behaviour, and nothing else of the project: it is all the parts of the UI below the
screens know."""

[[layer]]
name = "infrastructure"
imports = ["protocol", "domain"]
role = """
Technical details: the I/O with the outside, in both directions. May also import external libraries.

Its two levels never import each other. What both need is built at run time by `composition` and passed to each
(configuration, a connection, a logger), is a contract in `protocol` (a shape of data), or comes from an external
library (a technical tool)."""

[[layer.level]]
name = "inbound"
imports = ["protocol.inbound"]
role = """
Entry points from outside: the command line, HTTP endpoints, controllers, handlers of events and jobs. Each turns
what comes in into a call of an input port in `protocol.inbound`, and knows nothing else of the project: neither
the use cases nor `domain`."""

[[layer.level]]
name = "outbound"
imports = ["protocol.outbound", "domain"]
role = """
Connections to the outside: databases, API clients, files, queues. Each implements an output port of
`protocol.outbound`."""

[[layer]]
name = "application"
imports = ["protocol", "domain"]
role = """
Use cases. Each one carries one operation from start to finish.

A use case implements an input port of `protocol.inbound`, converting its data to and from `domain`, and reaches
the outside only through the output ports of `protocol.outbound`, whose implementations `composition` passes in.
Tests pass a fake."""

[[layer]]
name = "protocol"
imports = ["domain"]
role = """
The contracts at the boundary of dependency inversion: interfaces, and the data they carry, with no
implementation. Because `application` and `infrastructure` both depend on these and not on each other, either
side can change or be replaced by a fake.

Its two levels never import each other."""

[[layer.level]]
name = "inbound"
imports = []
role = """
Input ports: the interfaces of the use cases that the entry points call, with the data each takes and returns.
That data is plain, with no `domain` type, so an entry point knows nothing of `domain`."""

[[layer.level]]
name = "outbound"
imports = ["domain"]
role = """
Output ports: the interfaces to the outside (repositories, clients) that `application` calls and
`infrastructure.outbound` implements. Define a port only when `application` needs it, with only the methods
`application` calls."""

[[layer]]
name = "domain"
imports = []
role = """
The concepts and rules of the business: types, calculations and decisions. No I/O, and no ports: those are
contracts, in `protocol`."""
