# Where the layers live in a Rust project. What the layers are is in table.toml.
#
# A layer is a crate in `crates/`: a library with the role as its `//!` documentation.

# Code is a crate in `crates/` (a `Cargo.toml` at any depth, outside `.gitignore` and hidden directories), and a `.rs`
# file in `src/` of the root package, which holds the entry file and nothing else: `src/lib.rs`, `src/bin/`, and a
# module of the entry file (`src/pricing.rs`) are code outside every layer, however the package's manifest declares
# them. Code outside every layer fails, unless the project lists it in `unchecked`. Nothing else is looked at, so
# `xtask/`, the workspace's own `Cargo.toml`, and what Cargo keeps outside `src/` in the root package (`build.rs`,
# `tests/`, `benches/`, `examples/`) are not layers
scope = "crates"
code = "Cargo.toml"
also_code = [{ scope = "src", code = "*.rs" }]
not_layers = []
doc_prefix = "//! "
# The UIs a project may declare besides "none": none yet. Rust UI is written with very different tools (Leptos,
# Dioxus, egui, ratatui); a UI joins this list with its tool, as its atomic levels would be read as the levels of
# `infrastructure` are
uis = []
# What Rotproof reads the code as: the dependencies each crate declares in its `Cargo.toml` and, for a crate with
# levels, the paths its `.rs` files name, for the direction check; and the comments of the `.rs` files in `crates/` for
# the marker check
language = "rust"
# The entry file, of the root package. Cargo compiles it against what the package's `Cargo.toml` declares, so that
# manifest is what the direction check reads for it
entry = "src/main.rs"
# What `rotproof create` writes into an entry file a unit declares that is not there: the text of `src/main.rs` below,
# whatever the entry is named
entry_text = '''
//! The entry file: it calls `composition` to build the program, and starts it. No layer.

fn main() {}
'''
# What `rotproof create` writes beside the `src/` of an entry file a unit declares, when it is not there: Cargo compiles
# a file as a crate only through a manifest above it. `{package}` is its name, the unit's, and `{dependencies}` is the
# `[dependencies]` table that names the unit's own `composition` by path, which an entry file calls
entry_package = '''
[package]
name = "{package}"
version = "0.1.0"
edition = "2024"
publish = false
{dependencies}'''
# The one manifest of a package, which a project that declares units keeps to the root of a unit (or a layer, which is a
# crate of its own)
manifest = "Cargo.toml"
# Where the rest of the root package's `src/` goes, said in the finding for code outside the layers (a crate in
# `crates/` that no layer is, too)
where_code_goes = "a rule of the program goes in crates/domain, a use case in crates/application, what wires them in crates/composition; src/main.rs is the one file of the root package's src/ that is no layer"
# Written once at the root with the project's files: the root package, which holds the entry file, and the workspace,
# so `cargo build` builds every crate of a layer. `{package}` is the project's name as a package name, and `{members}`
# the crates of the layers it makes, one to a line: a glob such as `crates/*` would also match the directory of a unit
# (`crates/billing`), which has no manifest, and Cargo fails on it
files = [
    { path = "Cargo.toml", text = '''
[package]
name = "{package}"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
composition = { path = "crates/composition" }

[workspace]
members = [{members}]
resolver = "3"
''' },
    { path = "src/main.rs", text = '''
//! The entry file: it calls `composition` to build the program, and starts it. No layer.

fn main() {}
''' },
]
# What is written in place of `files` when the project declares units: a workspace and nothing else. A unit's entry
# file is declared by the unit, in a package of its own, so the root holds no package and no entry file
unit_root_files = [
    { path = "Cargo.toml", text = '''
[workspace]
members = [{members}]
resolver = "3"
''' },
]

# `{package}` is the crate's name: the layer's, or the layer's behind its unit's (`billing_domain`) in a unit, so that
# two units never name two crates alike, which Cargo refuses
[layer]
path = "crates/{name}"
files = [
    { path = "Cargo.toml", text = '''
[package]
name = "{package}"
version = "0.1.0"
edition = "2024"
publish = false
''' },
    { path = "src/lib.rs", text = '''
{doc}
''' },
]

# A level is a module of its layer's crate, declared in the crate's `lib.rs` (a test keeps the two in step)
[level]
path = "crates/{layer}/src/{name}"
files = [{ path = "mod.rs", text = '''
{doc}
''' }]

[layers.protocol]
files = [
    { path = "Cargo.toml", text = '''
[package]
name = "{package}"
version = "0.1.0"
edition = "2024"
publish = false
''' },
    { path = "src/lib.rs", text = '''
{doc}

pub mod inbound;
pub mod outbound;
''' },
]

[layers.infrastructure]
files = [
    { path = "Cargo.toml", text = '''
[package]
name = "{package}"
version = "0.1.0"
edition = "2024"
publish = false
''' },
    { path = "src/lib.rs", text = '''
{doc}

pub mod inbound;
pub mod outbound;
''' },
]
