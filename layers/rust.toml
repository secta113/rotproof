# Where the layers live in a Rust project. What the layers are is in table.toml.
#
# A layer is a crate in `crates/`: a library with the role as its `//!` documentation, and `handler` a binary.

# Code is a crate in `crates/` (a `Cargo.toml` at any depth, outside `.gitignore` and hidden directories). A crate
# outside every layer fails, unless the project lists it in `unchecked`. Nothing outside `crates/` is looked at, so
# `xtask/` and the workspace's own `Cargo.toml` are not layers.
scope = "crates"
code = "Cargo.toml"
not_layers = []
doc_prefix = "//! "
# Rust UI is written with very different tools (Leptos, Dioxus, egui, ratatui), and the atomic levels inside one crate
# could only be checked by reading `use` statements. `ui` joins this layout with its tool and its check
without = ["ui"]
# What Rotproof reads the code as: the dependencies each crate declares in its `Cargo.toml` for the direction check,
# and the comments of the `.rs` files in `crates/` for the marker check
language = "rust"

[layer]
path = "crates/{name}"
files = [
    { path = "Cargo.toml", text = '''
[package]
name = "{name}"
version = "0.1.0"
edition = "2024"
publish = false
''' },
    { path = "src/lib.rs", text = '''
{doc}
''' },
]

[layers.handler]
files = [
    { path = "Cargo.toml", text = '''
[package]
name = "handler"
version = "0.1.0"
edition = "2024"
publish = false
''' },
    { path = "src/main.rs", text = '''
{doc}

fn main() {}
''' },
]
