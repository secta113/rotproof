# Where the layers live in a TypeScript project (React for `ui`). What the layers are is in table.toml.
#
# A layer is a directory in `src/` with an `index.ts`, with the role as its doc comment. A level is a directory inside
# its layer.

# Code is any file in `src/`, outside `.gitignore` and hidden directories. Code outside every layer fails, unless the
# project lists it in `unchecked` or `moving`. Nothing outside `src/` is looked at.
scope = "src"
code = "*"
not_layers = []
doc_prefix = " * "
# Every source file in `src/` (`.ts`, `.tsx`, `.js` and the others), read with oxc; the other files there are not read
language = "typescript"
# The UIs a project may declare besides "none" (the layers of table.toml that name one in `ui`)
uis = ["atomic"]
# A test sits beside the code it tests, since the layout has no place for tests outside `src/`, so a file is a test by
# its name, the default of Vitest and Jest: a source file named `*.test.*` or `*.spec.*`, and any file in a
# `__tests__/` directory. Every rule reads such a file as a test, as it reads what is in Python's `tests/`: no layer
# holds it, its imports and its reads of the environment are not judged, it may import what the code of a layer may
# not (a development dependency), and no code that is not a test imports it
tests = { names = ["*.test.*", "*.spec.*"], directories = ["__tests__"] }
# The packages an inner layer (`domain`, `protocol`, `application`, `presentation`) may import in every project, by the
# layer or level of the table: a screen's model keeps its state with React's hooks, so `react` (not `react-dom`, which
# draws) is allowed there. A project adds to it with `allowed` under `[dependencies]` of its declaration
allowed = { "presentation.models" = ["react"] }
# A view is JSX, and a file with JSX is `.tsx` (or `.jsx`): `presentation` holds none, whatever the file is called,
# unless it is a test (a test of a hook that needs a wrapper written in JSX). The extension is all Rotproof goes by: it
# reads the imports of a file, not what it draws, so a view written with `createElement` in a `.ts` file is not caught
no_view = { layers = ["presentation"], extensions = ["tsx", "jsx"], goes = "keep what the screen holds and decides in .ts files, and move the component into src/ui (a provider that hands a model's state to the parts of one screen into src/ui/pages, one of the whole program into src/composition), leaving its context and its state hooks here" }
# The entry file, where Vite's React starter (`npm create vite -- --template react-ts`) puts it and `index.html` loads
# it: moving it would mean editing `index.html` too
entry = "src/main.tsx"
# What `rotproof create` writes into an entry file a unit declares that is not there: a file with no code, whose doc
# comment says what it is. A unit's entry may be named otherwise than `src/main.tsx`, so the text is the layout's
entry_text = '''
/**
 * The entry file: it calls `composition` to build the program, and starts it. No layer.
 */
export {};
'''
# The one manifest of a package, which a project that declares units keeps to the root of a unit
manifest = "package.json"
# What `rotproof create` writes at the root of a unit that has no manifest, `{package}` the unit's name: without one,
# the dependencies check does not compare the unit's imports with a manifest, and one that is there is the project's
# and never written over
unit_manifest = '''
{
  "name": "{package}",
  "version": "0.1.0",
  "private": true
}
'''
# The rest of the starter moves: said in the finding for code outside the layers
where_code_goes = "a screen (Vite's App.tsx) goes in src/ui/pages; a style (index.css, App.css) or an image the UI shows (assets/) in src/ui/atoms"

[layer]
path = "src/{name}"
files = [{ path = "index.ts", text = '''
/**
{doc}
 */
export {};
''' }]

[level]
path = "src/{layer}/{name}"
files = [{ path = "index.ts", text = '''
/**
{doc}
 */
export {};
''' }]
