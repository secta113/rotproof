# Where the layers live in a TypeScript project (React for `ui`). What the layers are is in table.toml.
#
# A layer is a directory in `src/` with an `index.ts`, with the role as its doc comment. A level of `ui` is a directory
# inside it.

# Code is any file in `src/`, outside `.gitignore` and hidden directories. Code outside every layer fails, unless the
# project lists it in `unchecked`. Nothing outside `src/` is looked at.
scope = "src"
code = "*"
not_layers = []
doc_prefix = " * "
# Every source file in `src/` (`.ts`, `.tsx`, `.js` and the others), read with oxc; the other files there are not read
language = "typescript"
# Vite's React starter (`npm create vite -- --template react-ts`) puts its entry point at `src/main.tsx`, which
# `index.html` loads: it is `handler`'s by what it holds, and moving it would mean editing `index.html` too
belongs = { "src/main.tsx" = "handler" }
# The rest of the starter moves: said in the finding for code outside the layers
where_code_goes = "a screen (Vite's App.tsx) goes in src/ui/pages; a style (index.css, App.css) or an image the UI shows (assets/) in src/ui/atoms"

[layer]
path = "src/{name}"
files = [{ path = "index.ts", text = '''
/**
{doc}
 */
export {};
''' }]

[level]
path = "src/ui/{name}"
files = [{ path = "index.ts", text = '''
/**
{doc}
 */
export {};
''' }]
