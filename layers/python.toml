# Where the layers live in a Python project. What the layers are is in table.toml.
#
# A layer is a package at the root: `<layer>/__init__.py`, with the role as its docstring. A level is a
# package inside its layer.

# Code is a `.py` file anywhere at the root, outside `.gitignore` and hidden directories. Code outside every layer
# fails, unless it sits in a path below or the project lists it in `unchecked` or `moving`.
scope = ""
code = "*.py"
not_layers = ["tests"]
# Each line of the documentation starts with this
doc_prefix = ""
# What Rotproof reads the code as: its imports for the direction check, its comments for the marker check
language = "python"
# The UIs a project may declare besides "none" (the layers of table.toml that name one in `ui`)
uis = ["atomic"]
# The entry file, which `python .` runs
entry = "__main__.py"
# What `rotproof create` writes into an entry file a unit declares that is not there: a file with no code, whose
# docstring says what it is. A unit's entry may be named otherwise than `__main__.py`, so the text is the layout's
entry_text = '''
"""The entry file: it calls `composition` to build the program, and starts it. No layer.
"""
'''
# The one manifest of a package, which a project that declares units keeps to the root of a unit
manifest = "pyproject.toml"
# What `rotproof create` writes at the root of a unit that has no manifest, `{package}` the unit's name: the check of a
# locked project fails a unit without one, and a manifest that is there is the project's and never written over
unit_manifest = '''
[project]
name = "{package}"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
'''
# What a unit's own directory holds besides its layers and nests: its package's `__init__.py`, which imports no layer
unit_files = ["__init__.py"]

# A view of a project with screens may be a template file, which the server renders (a route function in
# `infrastructure.inbound` names one as a string, which is no import). A template is code like a `.py` file where the
# structure is judged: one outside the levels of `ui` fails as code outside the layers, so a file that is no template
# (a generated page, a report) is listed in `unchecked`. The references between templates are read as the template
# languages below, at the major versions named, and a path in one is a path from the directory of `ui`. A reference
# is judged by the level it lands in, as an import is, when a template is there; one that names no file of the project
# (a template of a package) is not judged. A language is left out for a unit whose `pyproject.toml` asks for another
# version of its package
[templates]
ui = "atomic"
extensions = ["html", "htm", "jinja", "jinja2", "j2"]

[[templates.language]]
name = "Jinja2"
package = "jinja2"
versions = [3]
tags = ["extends", "include", "import", "from"]

[[templates.language]]
name = "Django"
package = "django"
versions = [5, 6]
tags = ["extends", "include"]

[layer]
path = "{name}"
files = [{ path = "__init__.py", text = '''
"""{doc}
"""
''' }]

[level]
path = "{layer}/{name}"
files = [{ path = "__init__.py", text = '''
"""{doc}
"""
''' }]
