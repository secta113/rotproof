[package]
name = "application"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
# A layer of Rotproof, built into its binary: never published on its own, and not listed among the third-party crates
publish = false

[dependencies]
domain.workspace = true
utils.workspace = true

# The tests read real trees with the real readers too: tests may import every layer, and the direction check does not
# read dev-dependencies
[dev-dependencies]
chrono.workspace = true
infrastructure.workspace = true
serde_json.workspace = true
tempfile.workspace = true
