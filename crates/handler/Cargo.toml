[package]
name = "rotproof"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
# The handler layer, the command line, named for what it ships: the wheel, its SBOM and the command are rotproof.
# maturin builds the wheel from here, and nothing publishes the crate
publish = false

[dependencies]
application = { path = "../application" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
domain = { path = "../domain" }
infrastructure = { path = "../infrastructure" }

[dev-dependencies]
tempfile = "3.27.0"
