[package]
name = "rotproof"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
# Pinned exactly, and together: oxc's API changes between minor versions
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
# Pinned exactly: an internal crate of Ruff, whose API changes between any two versions
ruff_python_ast = "=0.0.16"
ruff_python_parser = "=0.0.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
utils = { path = "crates/utils" }
yaml-rust2 = "0.13.0"

[workspace]
members = ["xtask", "crates/utils"]

[dev-dependencies]
tempfile = "3.27.0"
