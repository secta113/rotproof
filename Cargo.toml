    "xtask",
    "crates/application",
    "crates/domain",
    "crates/handler",
    "crates/infrastructure",
    "crates/utils",
]
resolver = "3"

# Rotproof's version, the one place that names it: every crate of the workspace takes it, and maturin takes the
# wheel's from the handler
[workspace.package]
version = "0.1.0"
