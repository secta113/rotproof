[package]
name = "rotproof"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }
utils = { path = "crates/utils" }

[workspace]
members = ["xtask", "crates/domain", "crates/infrastructure", "crates/utils"]

# Rotproof's version, the one place that names it: every crate of the workspace takes it, and maturin takes the
# wheel's from the package
[workspace.package]
version = "0.1.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
